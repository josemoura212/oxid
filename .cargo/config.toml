# `#[sqlx::test]` reads DATABASE_URL at runtime to create each test's temporary
# database. The `query!` macros read `.env`, but that only covers compile time.
#
# `force = false`: the environment wins, so you can point at another database
# without editing this file. The credential here is the same as
# `configuration/local.yaml` — Postgres on localhost, not a secret.
[env]
DATABASE_URL = { value = "postgres://oxid:oxid@localhost:5432/oxid", force = false }
