name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No global `RUSTFLAGS: -D warnings` here: RUSTFLAGS applies to every crate
  # compiled from source, dependencies included, so one warning anywhere in the
  # tree fails the build. The `-- -D warnings` on the clippy calls below only
  # affects our own crates, which is what we actually want to enforce.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The committed .sqlx cache is what lets the macros compile without a
      # database. If it is stale, this fails — which is the point.
      - name: Clippy (back end)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --exclude oxid-web --all-targets -- -D warnings

      # The front end only type-checks on its own target: lints that exist solely
      # on wasm32 are invisible from the host.
      - name: Clippy (front end)
        run: cargo clippy -p oxid-web --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oxid
          POSTGRES_PASSWORD: oxid
          POSTGRES_DB: oxid
          # Must match the local cluster: the generated `url_hash` column is only
          # IMMUTABLE under a fixed encoding, so a different one would produce
          # different hashes.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxid -d oxid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_USER: oxid
          CLICKHOUSE_PASSWORD: oxid
          CLICKHOUSE_DB: oxid
        ports:
          - 8123:8123
        # 127.0.0.1, not localhost — localhost resolves to ::1 and ClickHouse
        # binds IPv4 only, so the probe would be refused forever. More retries
        # than Postgres and Redis because ClickHouse takes longer to accept
        # connections on a cold start.
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Compile against the committed cache. Without this the macros see
      # DATABASE_URL and validate against the live database instead — which is
      # empty here, because migrations only run inside `#[sqlx::test]`, long
      # after compilation. Locally it passes only because the dev database
      # already has the schema.
      #
      # This also means CI exercises the same .sqlx cache the production image
      # builds from: a stale cache fails here rather than in the release.
      SQLX_OFFLINE: "true"

      # Runtime, not compile time: `#[sqlx::test]` uses this to create a
      # temporary database per test, and SQLX_OFFLINE does not affect it.
      DATABASE_URL: postgres://oxid:oxid@localhost:5432/oxid
      OXID_TEST_REDIS: redis://127.0.0.1:6379
      OXID_TEST_CLICKHOUSE: 127.0.0.1:8123

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # `llvm-cov` runs the same tests, instrumented. Measuring here rather than
      # in a second job avoids standing up Postgres and Redis twice, and the
      # report is what Sonar reads instead of re-deriving coverage itself.
      - name: Run tests with coverage
        run: >-
          cargo llvm-cov --workspace --exclude oxid-web
          --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: lcov.info
          retention-days: 1

  sonar:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: test
    # A fork's pull request gets no secrets, so the scan would fail on a missing
    # SONAR_TOKEN rather than tell anyone anything. Same constraint that decided
    # the deploy trigger — see ROADMAP, "Pendência de CI".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history to attribute code to authors and to
          # work out what counts as new code. A shallow clone silently degrades
          # both.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v6
        with:
          name: coverage

      # Sonar imports this instead of running its own Rust analysis, so what it
      # reports is exactly what the lint gate already enforces. `|| true`: the
      # command exits non-zero when it finds lints, and here a finding is the
      # output, not a failure — the `lint` job is what blocks on them.
      - name: Clippy report
        env:
          SQLX_OFFLINE: "true"
        run: >-
          cargo clippy --workspace --exclude oxid-web --all-targets
          --message-format=json > clippy.json || true

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
