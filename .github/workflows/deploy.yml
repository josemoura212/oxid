name: Deploy

# Push to main, which in practice means "a pull request was merged" — the branch
# ruleset is what makes that the only way main moves.
#
# Deliberately not `pull_request: [closed]`, which was tried and reverted: runs
# from a fork receive no secrets, so a merged community PR would fail on a
# missing KUBECONFIG. A push event runs in the base repository and always has
# them.
#
# What keeps an admin-bypass push from shipping unreviewed is not the trigger,
# it is the `production` environment on the deploy job below: with required
# reviewers configured, the job waits for a human either way.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Owner rather than the full repository name: two images ship from this repo,
  # `oxid` and `oxid-web`, so the name is per-image below.
  OWNER: ${{ github.repository_owner }}

# Never two deploys at once, and never cancel one midway: a half-applied rollout
# is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.name }}
    # Native ARM runner, not amd64 + QEMU. The k3s node is an Oracle Ampere box,
    # so the images have to be arm64 — and emulating it costs 2-3x the build time
    # on a release profile that is already slow. Free on public repositories.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    strategy:
      # One failing image must not cancel the other: knowing whether the front
      # end also broke is worth the extra minute.
      fail-fast: false
      matrix:
        include:
          - name: api
            image: oxid
            dockerfile: infra/Dockerfile
          - name: web
            image: oxid-web
            dockerfile: infra/Dockerfile.web

    outputs:
      api-digest: ${{ steps.digest.outputs.api }}
      web-digest: ${{ steps.digest.outputs.web }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # The commit SHA is the tag that matters: `latest` cannot tell you what
          # is running, nor roll back to a known build.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Matches the runner, so this is a native build. Adding linux/amd64
          # here would bring QEMU back for that half.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image, otherwise the two matrix jobs overwrite each
          # other's cache and both rebuild from scratch every run.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Matrix jobs cannot each set the same output, so each writes its own key
      # and the deploy job reads whichever it needs.
      - id: digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${NAME}=${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: roll out to k3s
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      # A kubeconfig for a ServiceAccount scoped to the `oxid` namespace — not
      # the cluster admin one. See infra/k8s/README.md for how it is minted.
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Migrations run before the rollout, as a Job. Doing it inside the pods
      # would have both replicas racing on the same schema.
      #
      # Applied from a manifest, not `kubectl create job`: the migration needs
      # the same ConfigMap and Secret as the API, and the imperative form cannot
      # attach either.
      - name: Run migrations
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/oxid@${{ needs.build.outputs.api-digest }}
        run: |
          kubectl -n oxid delete job oxid-migrate --ignore-not-found --wait=true
          sed "s|IMAGE_REF|${IMAGE_REF}|" infra/k8s/50-migrate-job.yaml | kubectl apply -f -

          # `wait` errors out if the Job fails, so watch for either outcome and
          # surface the logs — a silent timeout says nothing about what broke.
          if ! kubectl -n oxid wait --for=condition=complete job/oxid-migrate --timeout=120s; then
            kubectl -n oxid logs job/oxid-migrate --tail=100 || true
            exit 1
          fi

      # Deploy by digest, not tag: `latest` is ambiguous and racy, the digest is
      # exactly the image this run built.
      #
      # API first: the front end talks to it, so a new bundle arriving before the
      # endpoint it expects would break for as long as the rollout takes.
      - name: Roll out API
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/oxid@${{ needs.build.outputs.api-digest }}
        run: |
          kubectl -n oxid set image deployment/api api="$IMAGE_REF"
          kubectl -n oxid rollout status deployment/api --timeout=180s

      - name: Roll out front end
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/oxid-web@${{ needs.build.outputs.web-digest }}
        run: |
          kubectl -n oxid set image deployment/web web="$IMAGE_REF"
          kubectl -n oxid rollout status deployment/web --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n oxid run "smoke-${GITHUB_RUN_ID}" \
            --rm -i --restart=Never --image=curlimages/curl:latest -- \
            sh -c 'curl -fsS --max-time 10 http://api.oxid.svc.cluster.local:3000/health \
                && curl -fsS --max-time 10 http://web.oxid.svc.cluster.local:8080/healthz'
