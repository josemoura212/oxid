#:schema https://raw.githubusercontent.com/rust-lang/cargo/refs/heads/master/crates/cargo-util-schemas/manifest.schema.json

[package]
name = "oxid"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["José Augusto <josemoura212@gmail.com>"]
description = "Encurtador de URL de alta performance em Rust — projeto de estudo de system design"
license = "MIT"
repository = "https://github.com/josemoura212/oxid"
homepage = "https://github.com/josemoura212/oxid"
keywords = ["url-shortener", "axum", "tokio", "postgres", "redis"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
warnings                      = "deny"
unsafe_code                   = "deny"
unused_extern_crates          = "warn"
unused_import_braces          = "deny"
unused_qualifications         = "deny"
unreachable_pub               = "deny"
trivial_casts                 = "deny"
trivial_numeric_casts         = "deny"
single_use_lifetimes          = "warn"
missing_debug_implementations = "deny"

[lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "deny",  priority = -1 }
nursery  = { level = "warn",  priority = -1 }
cargo    = { level = "allow", priority = -1 }
module_name_repetitions  = "allow"
missing_errors_doc       = "allow"
must_use_candidate       = "allow"
return_self_not_must_use = "allow"
unwrap_used             = "deny"
expect_used             = "deny"
panic                   = "deny"
unreachable             = "deny"
todo                    = "deny"
unimplemented           = "deny"
indexing_slicing        = "deny"
arithmetic_side_effects = "deny"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "warn"
