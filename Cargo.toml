#:schema https://raw.githubusercontent.com/rust-lang/cargo/refs/heads/master/crates/cargo-util-schemas/manifest.schema.json

[workspace]
resolver = "3"
members = ["crates/oxid-api", "crates/oxid-shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["José Augusto <josemoura212@gmail.com>"]
license = "MIT"
repository = "https://github.com/josemoura212/oxid"
homepage = "https://github.com/josemoura212/oxid"
publish = false

[workspace.dependencies]
oxid-shared = { path = "crates/oxid-shared" }

anyhow = "1.0.104"
axum = "0.8.9"
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.dependencies.sqlx]
default-features = false
features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "migrate",
    "macros",
    "tls-rustls-ring",
]
version = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_extern_crates = "warn"
unused_import_braces = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
