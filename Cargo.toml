[workspace]
resolver = "3"
members = ["crates/oxid-api", "crates/oxid-shared", "crates/oxid-web"]

# `oxid-web` targets wasm32; without this the root `cargo build` would try to
# compile it for the host. The front is built with `trunk` inside its folder.
default-members = ["crates/oxid-api", "crates/oxid-shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["José Augusto <josemoura212@gmail.com>"]
license = "MIT"
repository = "https://github.com/josemoura212/oxid"
homepage = "https://oxid.uk"
publish = false

[workspace.dependencies]
oxid-shared = { path = "crates/oxid-shared" }

anyhow = "1.0.104"
# Password hashing is meant to be slow — that is the defence. It also means every
# verification spends real CPU (~19 MiB and tens of milliseconds at the parameters
# in `auth::password`), which is why hashing runs off the runtime, under a
# concurrency cap, behind its own rate limit.
#
# The `rand` feature carries the OS random source used for salts and session ids,
# so there is no separate rand dependency — and no chance of two incompatible
# rand_core versions ending up in the tree.
argon2 = { version = "0.5.3", features = ["std", "rand"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
clickhouse = { version = "0.15.1", default-features = false, features = [
    "lz4",
    "chrono",
    "inserter",
] }
hex = "0.4.3"
# The cookie crate expresses Max-Age with this; using anything else would mean
# converting at every call site.
time = "0.3.44"
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
redis = { version = "1.5.0", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
] }
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", features = ["http"] }
# Already in the tree via web-sys; taken as a direct dependency for
# `encode_uri_component` — the browser's own query encoder, used so an opaque
# cursor survives the query string instead of a hand-rolled escaper that breaks
# the day the cursor format changes.
js-sys = "0.3.83"
gloo-storage = "0.4.0"
# web-sys gates every browser API behind its own feature, and the default set is
# empty on purpose. Clipboard for the copy button; Document and Element to keep
# `lang`, `<title>` and the description in step with the chosen language.
web-sys = { version = "0.3.103", features = [
    "Clipboard",
    "Document",
    "Element",
    "Navigator",
    "Window",
] }
http-body-util = "0.1.3"
metrics = "0.24.6"
# `default-features = false` drops the crate's own HTTP listener, which would
# pull in a second hyper stack and rustls just to serve one text endpoint. The
# recorder handle renders to a string, and axum already serves it.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
leptos = "0.8.20"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[workspace.dependencies.sqlx]
default-features = false
features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "migrate",
    "macros",
    "tls-rustls-ring",
]
version = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_extern_crates = "warn"
unused_import_braces = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# no future is `Send` on wasm32 (single-threaded), so the lint is pure noise in
# oxid-web. On the back it is redundant: `tokio::spawn` already requires `Send`.
future_not_send = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
