application:
  host: 127.0.0.1
  port: 3000
  base_url: http://127.0.0.1:3000
  # Separate listener, deliberately not routed by Traefik. 9090 is the Prometheus
  # convention for a scrape target.
  metrics_port: 9090

database:
  host: localhost
  port: 5432
  username: oxid
  database_name: oxid
  require_ssl: false
  # project rule — database cores × 2. A big pool does not speed anything up:
  # the original study blew up latency with 500 connections on a 2-vCPU Postgres.
  max_connections: 8
  acquire_timeout_seconds: 3
  # Generous next to the queries this service actually runs — a primary-key
  # lookup and a single insert — and that is the point: it is a backstop against
  # a query that hangs, not a performance target. Without it one stuck query
  # holds a connection indefinitely, and eight of them leave the pool empty.
  statement_timeout_ms: 3000

cache:
  host: localhost
  # Matches REDIS_PORT in .env. 6379 and 6380 are taken by other projects on the
  # dev machine; inside the cluster the service listens on 6379.
  port: 6381
  # Only the "does not exist" sentinel expires. Positive entries have no TTL —
  # a shortcode is immutable, so there is nothing to invalidate.
  negative_ttl_seconds: 60
  connect_timeout_seconds: 2

rate_limit:
  # Only POST /v1/shorten is limited. The redirect is the path the cache absorbs
  # and the one stages 9-10 push to 11k req/s — throttling it would punish the
  # traffic the system exists to serve.
  shorten_per_second: 5
  shorten_burst: 20
  # Much tighter than writing, because the cost is CPU rather than a row: every
  # attempt spends an Argon2 verification, including the ones for e-mails that
  # do not exist. Two per second still allows a person who mistypes.
  login_per_second: 2
  login_burst: 5
  # Independent of who is calling, unlike the limits above. Argon2 blocks a
  # thread while it runs, so this is what keeps a login flood from taking the
  # redirect path down with it.
  hash_concurrency: 1
  hash_wait_ms: 1000

session:
  # Seven days. Long enough not to annoy, short enough that a cookie captured
  # and forgotten does not stay useful indefinitely. Fixed rather than sliding —
  # see `SessionSettings`.
  ttl_seconds: 604800

analytics:
  # "off" quoted on purpose: unquoted, YAML reads off/on/yes/no as booleans, and
  # `off` would become `false` instead of the string the enum expects. Off is the
  # default because the load-test stages run with analytics contributing nothing,
  # and because a plain boot should not require ClickHouse to be up. Local and
  # production turn it on.
  backend: "off"
  clickhouse:
    host: localhost
    port: 8123
    user: oxid
    database: oxid
