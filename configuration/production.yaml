# `database.password` is deliberately absent — it comes from
# APP_DATABASE__PASSWORD. Without it the boot fails, which beats coming up
# with no credential.

application:
  host: 0.0.0.0
  base_url: https://oxid.uk

database:
  require_ssl: true

email:
  # `resend.api_key` is deliberately absent, like the database password — it
  # comes from APP_EMAIL__RESEND__API_KEY.
  backend: resend
  site_url: https://oxid.uk
  resend:
    from: oxid <nao-responda@oxid.uk>
