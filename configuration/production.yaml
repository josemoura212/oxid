# `database.password` is deliberately absent — it comes from
# APP_DATABASE__PASSWORD. Without it the boot fails, which beats coming up
# with no credential.

application:
  host: 0.0.0.0
  base_url: https://oxid.uk

database:
  require_ssl: true

email:
  # **No provider block here, and that is load-bearing.** Naming one — even with
  # only a `from` in it — makes that provider's credential a required field for
  # every deployment, including one that selected the other provider. It is the
  # same shape as the missing ClickHouse password that stopped the migration Job
  # from booting, and it would mean choosing Cloudflare still demanded a Resend
  # key.
  #
  # Both fields of whichever provider is selected come from the environment: the
  # address from the ConfigMap, the credential from a Secret.
  backend: resend
  site_url: https://oxid.uk
