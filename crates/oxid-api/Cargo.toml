[package]
name = "oxid-api"
description = "High-performance URL shortener in Rust — a system design study project"
keywords = ["url-shortener", "axum", "tokio", "postgres", "redis"]
categories = ["web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
# Two binaries live here, so `cargo run -p oxid-api` is ambiguous without this.
# The dev container runs exactly that command and had been restart-looping on
# the error ever since `oxid-migrate` was added — visible only in the logs,
# because watchexec kept the container "Up" while nothing listened.
default-run = "oxid"

[lib]
name = "oxid"
path = "src/lib.rs"

[[bin]]
name = "oxid"
path = "src/main.rs"

[[bin]]
name = "oxid-migrate"
path = "src/bin/migrate.rs"

[dependencies]
oxid-shared.workspace = true

anyhow.workspace = true
axum.workspace = true
config.workspace = true
redis.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
