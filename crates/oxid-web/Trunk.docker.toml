# Used only by infra/docker-compose.local.yml, via `trunk serve --config`.
# Separate file because `--proxy-backend` on the CLI *adds* a proxy instead of
# replacing the one in Trunk.toml — two routes on /v1 make trunk's own router
# panic with a conflict.

[build]
target = "index.html"
# Must match Trunk.toml and production, or the absolute font preloads in
# index.html point at nothing.
public_url = "/assets/"

[serve]
address = "0.0.0.0"
port = 8080
open = false

# `api` is the compose service name, resolved by Docker's internal DNS.
[[proxy]]
backend = "http://api:3000/v1"
