# EN: Used only by infra/docker-compose.local.yml, via `trunk serve --config`.
# EN: Separate file because `--proxy-backend` on the CLI *adds* a proxy instead of
# EN: replacing the one in Trunk.toml — two routes on /v1 make trunk's own router
# EN: panic with a conflict.
# PT: Usado só pelo infra/docker-compose.local.yml, via `trunk serve --config`.
# PT: Arquivo separado porque `--proxy-backend` na CLI *adiciona* um proxy em vez
# PT: de substituir o do Trunk.toml — duas rotas em /v1 fazem o router do próprio
# PT: trunk panicar por conflito.

[build]
target = "index.html"

[serve]
address = "0.0.0.0"
port = 8080
open = false

# EN: `api` is the compose service name, resolved by Docker's internal DNS.
# PT: `api` é o nome do serviço no compose, resolvido pelo DNS interno do Docker.
[[proxy]]
backend = "http://api:3000/v1"
