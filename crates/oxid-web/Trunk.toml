[build]
target = "index.html"

[serve]
port = 8080
open = false

# Forwards /v1/* to the API. Without it the front on :8080 calling :3000 would
# be cross-origin and the browser would block it. With the proxy the front talks
# to its own origin — same as production behind Nginx.
[[proxy]]
backend = "http://127.0.0.1:3000/v1"
