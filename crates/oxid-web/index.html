<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxid</title>
    <meta name="description" content="High-performance URL shortener in Rust" />
    <meta name="theme-color" content="#d4693a" />
    <link data-trunk rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!--
      wasm-opt is off: the binaryen build trunk downloads (version 123) exits 1
      on arm64, and the apt package is 108 — trunk ignores the one on PATH and
      always uses its own. Losing -Oz makes the bundle bigger, but nginx gzips it
      on the way out, so the wire cost is much smaller than the file size
      suggests. Worth revisiting when trunk ships a working arm64 binary.
    -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <!--
      Inlined rather than linked: as a separate file the stylesheet costs a full
      round trip before the first paint, which is where Lighthouse's 150 ms of
      render blocking came from. It travels inside a no-cache document now, so
      the trade is those bytes on every visit against that round trip.

      Cost to remember: an inline <style> needs 'unsafe-inline' or a per-build
      hash under a Content-Security-Policy. The CSP is already non-trivial here
      because trunk emits the wasm bootstrap as an inline <script>.
    -->
    <link data-trunk rel="inline" href="style.css" />
    <!--
      copy-dir does not fingerprint what it copies, and nginx serves everything
      under /assets/ as immutable for a year. The version lives in the filename
      so replacing the typeface later cannot serve a stale cached file.

      Both weights are subset to ASCII plus ten symbols: 5 KB each, against
      ~90 KB for the full family.
    -->
    <link data-trunk rel="copy-dir" href="fonts" />
    <!--
      Preloaded because nothing else would ask for them in time. The body ships
      empty and the text only exists once the wasm has mounted, so without this
      the font requests do not even start until after that — the one moment the
      page has something to show.

      Absolute /assets/ path: `public_url` now matches in development and in
      production precisely so this link is correct in both.
    -->
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-400-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-600-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body></body>
</html>
