# Override that adds API and front with hot reload on top of the Postgres from
# docker-compose.yml. Source comes from the host by bind mount, so editing a
# file on the host rebuilds inside the container.
#
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.local.yml up

x-rust-dev: &rust-dev
  build:
    context: ..
    dockerfile: infra/Dockerfile.dev
  # runs as the host user so files written into the bind mount (Cargo.lock,
  # .sqlx) do not end up owned by root.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  # `init` puts tini as PID 1, which forwards SIGTERM to the child and reaps
  # zombies. Without it cargo/trunk ignore the stop signal and Docker waits the
  # full grace period before SIGKILL — that is the slow shutdown.
  init: true
  # nothing to flush on shutdown; no reason to wait the default 10s.
  stop_grace_period: 2s
  environment:
    CARGO_TARGET_DIR: /target

services:
  api:
    <<: *rust-dev
    container_name: oxid-api
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # `postgres` is the compose service name — inside the network it resolves
      # to the container. `localhost` would be the api container itself.
      DATABASE_URL: postgres://${POSTGRES_USER:-oxid}:${POSTGRES_PASSWORD:-oxid}@postgres:5432/${POSTGRES_DB:-oxid}
      APP_DATABASE__HOST: postgres
      # 0.0.0.0 so the published port actually reaches the process.
      APP_APPLICATION__HOST: 0.0.0.0
      # The redirect lives at `/{code}`, and in dev `/` on :8080 is the trunk dev
      # server serving the front end — a shortcode there would hit the SPA
      # fallback. So links point straight at the API. Behind Nginx (stage 8) both
      # share one origin and this becomes the public domain.
      APP_APPLICATION__BASE_URL: http://127.0.0.1:3000
      RUST_LOG: ${RUST_LOG:-oxid=debug,tower_http=debug,info}
      CARGO_TARGET_DIR: /target

    volumes:
      - ..:/app
      - cargo-registry:/cargo
      # named volume, not bind: the host `target/` holds artifacts from another
      # toolchain and sharing it would force a full rebuild on every switch.
      - api-target:/target

    # watches only what the API compiles from. Watching `crates` whole would
    # catch `oxid-web/dist/`, and every trunk rebuild would restart the API.
    command: >
      watchexec
      -w crates/oxid-api
      -w crates/oxid-shared
      -w migrations
      -e rs,toml,sql
      --restart
      -- cargo run -p oxid-api
    ports:
      - "3000:3000"

  web:
    <<: *rust-dev
    container_name: oxid-web
    depends_on:
      - api

    volumes:
      - ..:/app
      - cargo-registry:/cargo
      # separate from the api's: a shared target dir serializes both cargos on
      # the same lock file, and one waits for the other on every rebuild.
      - web-target:/target

    working_dir: /app/crates/oxid-web
    # trunk watches files on its own — no cargo-watch needed here. The separate
    # config points the proxy at the `api` service; `--proxy-backend` on the CLI
    # would *add* a second route on /v1 and make trunk panic.
    command: trunk serve --config Trunk.docker.toml
    ports:
      - "8080:8080"

volumes:
  cargo-registry:
    name: oxid-cargo-registry
  api-target:
    name: oxid-api-target
  web-target:
    name: oxid-web-target
