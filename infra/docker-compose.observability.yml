# Prometheus and Grafana, kept out of the default `up`.
#
# Separate file for the same reason as docker-compose.local.yml: most of the time
# the dev loop only needs Postgres, Redis and the app, and two more containers on
# a laptop are two more containers competing for the same cores the load tests
# will care about.
#
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.local.yml \
#     -f infra/docker-compose.observability.yml up

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: oxid-prometheus
    restart: unless-stopped

    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Enough history to compare a load-test run against the one before it, and
      # not so much that a laptop ends up storing months of idle scrapes.
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:12.3.1
    container_name: oxid-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-3001}:3000"

    environment:
      # A login screen on a dashboard that only exists on localhost is friction
      # without a threat model. This file is never what runs in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

volumes:
  prometheus-data:
    name: oxid-prometheus-data
  grafana-data:
    name: oxid-grafana-data
