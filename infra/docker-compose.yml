name: oxid

services:
  postgres:
    image: postgres:18-alpine
    container_name: oxid-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxid}
      POSTGRES_DB: ${POSTGRES_DB:-oxid}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Postgres 18+ mounts at the root, not `/data`: the image stores data in
      # a per-major-version subdirectory. With the old path it aborts the boot.
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-oxid} -d ${POSTGRES_DB:-oxid}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: oxid-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    # Eviction is Redis's job, not the application's. The cache stores every miss
    # with no TTL, so `maxmemory` plus `allkeys-lru` is what keeps it bounded —
    # the original study capped the cache to a top-100 ranking instead and ended
    # up with a 50% hit rate.
    #
    # No persistence: every entry is reconstructible from Postgres, so an AOF or
    # RDB would cost write throughput to protect data we do not need protected.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    container_name: oxid-clickhouse
    restart: unless-stopped

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-oxid}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-oxid}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-oxid}
      # Off by default the default user answers with no password from anywhere;
      # this makes the named user the only way in.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    ports:
      # 8123 is the HTTP interface the `clickhouse` crate talks to. 9000 is the
      # native protocol, published only so `clickhouse-client` can attach for
      # debugging — the app never uses it.
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    # ClickHouse assumes the machine is its own and will size caches to all of
    # RAM. On a node that already runs Postgres, Redis and the API, that is how
    # it starts fighting them for the 12 GB — so the ceiling is explicit. The
    # 30-day TTL keeps the working set small enough for this to be comfortable.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-2g}

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  postgres-data:
    name: oxid-postgres-data
  clickhouse-data:
    name: oxid-clickhouse-data
