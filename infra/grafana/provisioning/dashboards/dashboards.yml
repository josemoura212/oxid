apiVersion: 1

providers:
  - name: oxid
    type: file
    # Provisioned from disk rather than clicked together in the UI: a dashboard
    # that only exists in Grafana's database is lost with the volume, and cannot
    # be reviewed in a pull request.
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
