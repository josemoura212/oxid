# Shared configuration, applied **before** anything that reads it.
#
# In its own file, and that is the fix for a deploy that failed rather than a
# preference. This map used to live beside the Deployment in `30-api.yaml`, which
# the pipeline applies *after* the migration Job — so the Job ran with the new
# image and the previous map. The moment a release added a key the image had
# started requiring, the Job could not boot, and it took the whole deploy with
# it. Nothing was wrong with the key; the ordering was.
#
# Applied first, every consumer sees the same configuration the release expects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oxid-config
  namespace: oxid
data:
  # Overrides on top of configuration/production.yaml, which ships in the image.
  # `__` maps nesting: APP_DATABASE__HOST feeds database.host.
  APP_ENVIRONMENT: "production"
  APP_DATABASE__HOST: "postgres.oxid.svc.cluster.local"
  APP_DATABASE__PORT: "5432"
  # In-cluster traffic never leaves the node, and Postgres here has no TLS
  # configured. Turn this on the day the database moves off-cluster.
  APP_DATABASE__REQUIRE_SSL: "false"
  APP_APPLICATION__BASE_URL: "https://oxid.uk"
  APP_CACHE__HOST: "redis.oxid.svc.cluster.local"
  APP_CACHE__PORT: "6379"
  # Analytics on in production. The password is a Secret, wired as an env on the
  # Deployment below; everything else is plain config. If ClickHouse is down the
  # sink degrades to disabled and the redirect keeps serving — analytics is never
  # on the hot path.
  APP_ANALYTICS__BACKEND: "clickhouse"
  APP_ANALYTICS__CLICKHOUSE__HOST: "clickhouse.oxid.svc.cluster.local"
  APP_ANALYTICS__CLICKHOUSE__PORT: "8123"
  APP_ANALYTICS__CLICKHOUSE__USER: "oxid"
  APP_ANALYTICS__CLICKHOUSE__DATABASE: "oxid"
  # E-mail. The provider is chosen here, so switching between Resend and
  # Cloudflare is an edit to this ConfigMap rather than a code change. Only the
  # credential is a Secret; the From address is not one.
  APP_EMAIL__RESEND__FROM: "oxid <nao-responda@oxid.uk>"
  RUST_LOG: "oxid=info,tower_http=info,warn"
