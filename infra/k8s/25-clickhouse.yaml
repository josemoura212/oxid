# ClickHouse for click analytics. A StatefulSet for the same reason as Postgres:
# a stable identity and a volume that survives rescheduling, never two pods on
# one data directory.
#
# It is off the redirect's hot path — the API degrades to a disabled sink if this
# is unreachable and keeps serving — so a hiccup here never takes the product
# down. What it can do is fight the rest of the node for RAM, which is why the
# ceiling below is explicit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-tuning
  namespace: oxid
data:
  # ClickHouse sizes its caches to the machine it thinks it owns. On a 2-vCPU,
  # 12 GB node already running Postgres, Redis, two API replicas and the front
  # end, that default is how it starts starving them. 25.3 reads the cgroup limit
  # for max_server_memory_usage, so the ratio caps query memory to ~0.7 of the
  # 2Gi limit below; the rest trims the caches a small analytics workload with a
  # 30-day TTL never needs large.
  low-memory.xml: |
    <clickhouse>
        <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
        <mark_cache_size>536870912</mark_cache_size>
        <uncompressed_cache_size>0</uncompressed_cache_size>
    </clickhouse>

  # ClickHouse's own telemetry, which on an instance this small is the entire
  # workload. Left at defaults it wrote 2.9 GB of system logs against 8 KB of
  # click data — `trace_log` 1.6 GB, `text_log` 1.0 GB — and the constant flushing
  # and merging of them held ~1.2 of the node's 2 cores and filled the 1.4 GiB
  # memory ceiling. Once that ceiling is reached ClickHouse kills incoming
  # queries, so the dashboard failed with "could not load the stats" while the
  # server looked healthy.
  #
  # The defaults are not wrong; they are sized for a cluster where this telemetry
  # is a rounding error against real data. Here the ratio inverts.
  #
  # Five are off outright. `trace_log` and `text_log` are a sampling profiler and a
  # copy of every log line — nobody reads either here, and between them they wrote
  # 2.6 GB against 8 KB of click data.
  #
  # `metric_log` and `asynchronous_metric_log` went too, and for a different
  # reason worth separating: they are not big on disk, they are **wide**. Each
  # carries a column per internal metric — over a thousand of them — and a row
  # every second. Consolidating a part that shape needs more memory than this
  # instance is allowed to have, so the flush fails, retries, and fails again:
  # 1.55 million MEMORY_LIMIT_EXCEEDED in 44 hours, each one logged, the retry
  # loop holding 1.4 of the node's 2 cores.
  #
  # That distinction is the lesson from the first attempt at this file, which
  # gave these two a 7-day TTL and considered them handled. Retention was never
  # the problem. A table that cannot be merged once will not merge better a week
  # later, and the TTL evaluation is itself a merge.
  #
  # What is lost is nothing anyone was reading: the API already exports its own
  # metrics to Prometheus, and Grafana is where they get looked at. ClickHouse
  # observing itself once a second was buying a dashboard nobody opens.
  #
  # The three that stay are narrow — a handful of columns, written per event
  # rather than per second — and they answer real questions when something breaks.
  system-logs.xml: |
    <clickhouse>
        <trace_log remove="remove"/>
        <text_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>

        <query_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </query_log>
        <part_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </part_log>
        <error_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
    </clickhouse>

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: oxid
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      securityContext:
        # The image runs as uid 101 (clickhouse); the volume must be writable by
        # its group after a rescheduling remounts it.
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3-alpine

          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: { name: oxid-clickhouse, key: username }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: oxid-clickhouse, key: password }
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef: { name: oxid-clickhouse, key: database }
            # Without this the built-in default user answers with no password from
            # anywhere; turning it on makes the named user the only way in.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"

          ports:
            # 8123 is the HTTP interface the `clickhouse` crate talks to. 9000 is
            # the native protocol, kept for `clickhouse-client` debugging only —
            # the app never uses it, and neither port leaves the cluster.
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native

          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: tuning
              mountPath: /etc/clickhouse-server/config.d/low-memory.xml
              subPath: low-memory.xml
            - name: tuning
              mountPath: /etc/clickhouse-server/config.d/system-logs.xml
              subPath: system-logs.xml

          # 127.0.0.1, not localhost: localhost resolves to ::1 and ClickHouse
          # binds IPv4 only by default, so the probe would get connection-refused
          # and the pod would never go ready.
          readinessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
            initialDelaySeconds: 30
            periodSeconds: 15

          # 4Gi rather than the 2Gi this started with, because the two resources
          # are not equally scarce here and treating them alike was the mistake.
          # The node has 12 GB and runs at roughly 60% of it, so memory is the
          # cheap one — while CPU sits near saturation with 2 cores for
          # everything. A tight memory ceiling bought nothing and cost the
          # dashboard: queries that could not allocate were killed, which is how
          # this surfaced.
          #
          # Still a ceiling, not an absence of one. It is what stops a runaway
          # query taking the node down with it, and `max_server_memory_usage_to_
          # ram_ratio` above keeps the server's own budget at 0.7 of whatever this
          # says.
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }

      volumes:
        - name: tuning
          configMap:
            name: clickhouse-tuning

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: oxid
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native
