# Migration Job. The deploy workflow substitutes IMAGE_REF and applies this.
#
# A manifest rather than `kubectl create job --image=...` because the migration
# needs the same configuration as the API — ConfigMap plus database Secret — and
# the imperative form has no way to attach either.
apiVersion: batch/v1
kind: Job
metadata:
  name: oxid-migrate
  namespace: oxid
spec:
  # Migrations are idempotent (sqlx tracks what ran) so a retry is safe, but
  # three failures in a row means something a retry will not fix.
  backoffLimit: 3
  # Clean up on its own; the deploy only needs the exit status.
  ttlSecondsAfterFinished: 300

  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: IMAGE_REF
          command: ["/usr/local/bin/oxid-migrate"]

          envFrom:
            - configMapRef:
                name: oxid-config

          env:
            - name: APP_DATABASE__USERNAME
              valueFrom:
                secretKeyRef: { name: oxid-db, key: username }
            - name: APP_DATABASE__PASSWORD
              valueFrom:
                secretKeyRef: { name: oxid-db, key: password }
            - name: APP_DATABASE__DATABASE_NAME
              valueFrom:
                secretKeyRef: { name: oxid-db, key: database }

            # The migrator loads the whole `Settings` but reads only
            # `settings.database`. The ConfigMap above turns analytics on for the
            # API, and this Job inherits that — which makes
            # `analytics.clickhouse.password` a required field for a process that
            # never opens a ClickHouse connection. An explicit `env` overrides
            # `envFrom`, so these two lines say what is true: no analytics here.
            #
            # A placeholder rather than the real Secret on purpose. Handing a
            # credential to a process that cannot use it widens the blast radius of
            # this Job for nothing. The deeper fix is for the migrator to load only
            # the section it needs — see ROADMAP.md.
            - name: APP_ANALYTICS__BACKEND
              value: "off"
            - name: APP_ANALYTICS__CLICKHOUSE__PASSWORD
              value: ""

          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
