# Traefik dynamic configuration for Grafana — paste into Coolify under
# Servers → Proxy → Dynamic Configurations, as a file named `grafana.yaml`,
# replacing GRAFANA_HOST with the real hostname first.
#
# The placeholder is not ceremony. Cloudflare serves this domain with a wildcard
# certificate, so subdomains never appear in Certificate Transparency logs —
# unlike a per-host Let's Encrypt certificate, which publishes every name it
# signs. Committing the real hostname would therefore give away something that
# cannot be found any other way. It is a thin layer, and it is not what secures
# Grafana; the login and the firewall are.
#
# Same shape as `infra/k8s/traefik-oxid.yaml`: Traefik runs outside the cluster
# and reaches the node over host.docker.internal on the NodePort.
#
# No basic-auth middleware, and that is a decision rather than an omission:
# Grafana has real authentication, with per-user accounts and sessions. Stacking
# HTTP basic auth on top would add a second, shared password that nobody
# rotates — a worse secret guarding a better one.
#
# Prometheus is deliberately absent. It ships with no authentication at all, so
# exposing it would publish every metric to whoever finds the hostname. Reach it
# with:
#
#   kubectl -n monitoring port-forward svc/prometheus-kube-prometheus-prometheus 9090:9090

http:
  routers:
    grafana:
      rule: Host(`GRAFANA_HOST`)
      entryPoints:
        - https
      service: grafana
      middlewares:
        - grafana-security
      tls:
        certResolver: letsencrypt

  middlewares:
    grafana-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          # Grafana embeds its own panels in iframes, so `frame-ancestors 'none'`
          # would break parts of its UI. `'self'` keeps other sites from framing
          # it while leaving Grafana able to frame itself.
          Content-Security-Policy: "frame-ancestors 'self'"

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:30093"
