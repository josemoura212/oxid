# Traefik dynamic configuration — paste into Coolify under
# Servers → Proxy → Dynamic Configurations, as a file named `oxid.yaml`.
#
# This does NOT go into the cluster. Traefik runs outside k3s, in Docker managed
# by Coolify, and reaches the node through host.docker.internal on the NodePort.
#
# `certResolver: letsencrypt`, same as sensor.mangatrix.net — which also sits
# behind the Cloudflare proxy and renews fine, so the ACME HTTP-01 challenge does
# reach the origin through it.
#
# Preferred over the Cloudflare Origin Certificate in `cert.yaml` for one reason:
# an Origin Certificate is only trusted by Cloudflare, so it forces the orange
# cloud to stay ON. Stages 9 and 10 will want it OFF — the Cloudflare cache and
# rate limiting would otherwise be what k6 measures.

http:
  middlewares:
    # Applied to both routers below, so the API answers with the same headers as
    # the front end — a shortcode redirect is a response like any other.
    #
    # Lighthouse reports these under "Trust and safety". They are informational
    # audits and do not move the score, which is exactly why they are easy to
    # never get around to.
    oxid-security:
      headers:
        # One year, subdomains included. `stsPreload` only emits the token; the
        # domain is not actually preloaded until submitted at hstspreload.org,
        # and that submission is hard to undo — leave it as a separate decision.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # X-Frame-Options: DENY. Kept alongside the CSP directive below because
        # older clients only understand this one.
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          # `frame-ancestors` only — a full CSP is a separate job here, because
          # trunk emits the wasm bootstrap as an inline <script> and the
          # stylesheet is now inline too, so `script-src`/`style-src` would need
          # a per-build hash or nonce. This directive is safe on its own: it
          # constrains framing and nothing else.
          Content-Security-Policy: "frame-ancestors 'none'"
          Cross-Origin-Opener-Policy: same-origin

  routers:
    # The front end gets exactly two paths and nothing else. This matters because
    # the API matches `/{code}` on any single-segment path: give the front a
    # broader rule and shortcodes start landing on nginx.
    #
    # The explicit priority removes any doubt about which router wins — Traefik
    # ranks by rule length otherwise, which is implicit and easy to break by
    # editing a rule.
    oxid-web:
      rule: Host(`oxid.uk`) && (Path(`/`) || PathPrefix(`/assets`))
      priority: 100
      entryPoints:
        - https
      service: oxid-web
      middlewares:
        - oxid-security
      tls:
        certResolver: letsencrypt

    # Everything else: /health, /v1/shorten, and every shortcode.
    oxid-api:
      rule: Host(`oxid.uk`) || Host(`www.oxid.uk`)
      priority: 10
      entryPoints:
        - https
      service: oxid-api
      middlewares:
        - oxid-security
      tls:
        certResolver: letsencrypt

  services:
    oxid-web:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:30092"

    oxid-api:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:30091"
