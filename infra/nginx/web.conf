server {
    # 8080, not 80: the container runs unprivileged and cannot bind low ports.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Traefik terminates TLS and talks plain HTTP here; without this every
    # request logs as the proxy's address.
    set_real_ip_from 10.42.0.0/16;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    # 2.3 MB of WebAssembly is the whole payload — not compressing it is the
    # single biggest thing you can get wrong here.
    gzip_min_length 1024;

    # Trunk fingerprints every asset (`oxid-web-<hash>.wasm`), so the content of
    # a given URL can never change. A year of immutable caching is safe, and a
    # rebuild simply produces a different filename.
    location /assets/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file that is NOT fingerprinted: it holds the
    # references to the hashed assets. Caching it would pin users to an old
    # bundle after a deploy.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Anything else belongs to the API, and Traefik should never have routed it
    # here. 404 rather than falling back to index.html: an SPA fallback would
    # answer 200 for shortcodes that reached the wrong service, hiding the
    # misrouting behind a blank page.
    location / {
        return 404;
    }
}
