global:
  # 15 s is Prometheus' own default and the right starting point: rendering the
  # registry walks every series, so a 1 s scrape spends real CPU on the service
  # being measured. Stages 9 and 10 may want it tighter for a short window —
  # that is a deliberate trade, not the default.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oxid-api
    static_configs:
      # The compose service name, resolved on the compose network. An earlier
      # version pointed at `host.docker.internal`, which assumed the API ran on
      # the host — it does not, it runs as a container here, so nothing was ever
      # scraped.
      #
      # Port 9090 is never published to the host, and does not need to be: the
      # point of the separate listener is that it stays reachable from inside
      # and nowhere else.
      - targets: ["api:9090"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
