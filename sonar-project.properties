# SonarQube configuration.
#
# The organization matches the one already in use on josemoura212/FC-sonar-node,
# and the key follows the same `<organization>_<name>` shape. Confirm the key
# against the project page after importing: a mismatch fails with "project not
# found", which does not name the real cause.
#
# This project cannot use Automatic Analysis, the token-free setup on
# josemoura212/Fc-sonar. That mode covers every SonarQube Cloud language except
# Objective-C, Dart and Rust — and it imports neither coverage nor external
# linter reports, which are the two things worth sending here.
sonar.projectKey=josemoura212_oxid
sonar.organization=josemoura212
sonar.projectName=oxid
sonar.sourceEncoding=UTF-8

sonar.sources=crates
sonar.tests=crates/oxid-api/tests

# The build output, the sqlx query cache and the compiled front end are all
# generated: analysing them measures the toolchain, not this project.
#
# The integration tests are excluded from `sources` because they are already
# `tests`, and the scanner refuses to index a file twice — the two sets have to
# be disjoint. Unit tests stay inside `src` under `#[cfg(test)]` and cannot be
# separated this way, so Sonar reads them as main code.
sonar.exclusions=target/**,.sqlx/**,crates/oxid-web/dist/**,crates/oxid-web/fonts/**,crates/oxid-api/tests/**

# A translation catalogue is repetitive by definition: every locale repeats the
# same nineteen field names with different values, which the copy-paste detector
# reads as duplication (20.2% in this one file, against 0% everywhere else).
#
# The alternatives all make the code worse. A HashMap keyed by string, or a
# macro, would hide the property that motivated this design in the first place —
# an incomplete locale is a compile error, not a silent runtime fallback. The
# number also grows with every language added, so this is permanent rather than
# a stopgap.
sonar.cpd.exclusions=crates/oxid-web/src/i18n.rs

# Imported rather than re-derived. The lint gate in CI is already the strictest
# statement about this code — clippy with pedantic denied — so having Sonar
# report anything different would mean two contradictory standards.
sonar.rust.clippy.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info
